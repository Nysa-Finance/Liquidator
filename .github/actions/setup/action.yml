name: Setup
description: Node, npm and dependencies, pinned to the versions the lockfile was authored with.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm

    # The lockfile is written by npm 12, and npm 10/11 resolve optional peer
    # dependencies differently — enough for `npm ci` to reject the lock as out
    # of sync. Pin the same major the lockfile was authored with.
    - run: npm i -g npm@12
      shell: bash
    - run: npm ci
      shell: bash

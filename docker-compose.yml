# The liquidator as one container, next to whatever else runs on the host.
#
# Layout on the server:
#   /opt/liquidator/app               this checkout
#   /opt/liquidator/.env              settings (no trailing comments on a line)
#   /opt/liquidator/liquidator.json   the hot key, owned by uid 10001, mode 400
#
#   /opt/liquidator is mode 700: run compose by file path, not after a cd
#   alias liq='sudo docker compose -f /opt/liquidator/app/docker-compose.yml'
#   liq up -d --build      start
#   liq build --pull && liq up -d   update after git pull, with the latest Node patches
#   liq logs -f            follow the logs
services:
  liquidator:
    build: .
    image: liquidator:local
    container_name: liquidator
    # A uid no host account has (Ubuntu's first user is 1000), so the key file
    # is readable by this container and by nobody else but root.
    user: "10001:10001"
    restart: always
    env_file: ../.env
    environment:
      KEYPAIR_PATH: /keys/liquidator.json
    volumes:
      - ../liquidator.json:/keys/liquidator.json:ro
    # It talks to RPCs and Telegram and nothing talks to it: no ports.
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    # SIGTERM lets the round in flight finish; the bot exits within a second.
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "5" }
